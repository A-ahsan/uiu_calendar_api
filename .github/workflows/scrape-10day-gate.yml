name: Scrape calendars (10-day gate)

on:
  schedule:
    # Run daily at 03:00 UTC; the job itself will only perform scraping when >=10 days
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - id: skip_check
        name: Check last run (skip if < 10 days)
        run: |
          THRESH_DAYS=10
          FILE=web/.last_scrape
          if [ -f "$FILE" ]; then
            last=$(cat "$FILE")
            last_ts=$(date -u -d "$last" +%s 2>/dev/null || echo 0)
            now_ts=$(date -u +%s)
            age=$(( (now_ts - last_ts) / 86400 ))
            echo "Last run was $age days ago"
            if [ "$age" -lt "$THRESH_DAYS" ]; then
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "Skipping scraper because last run is less than $THRESH_DAYS days ago" >&2
              exit 0
            fi
          fi
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Run scraper
        if: ${{ steps.skip_check.outputs.skip == 'false' }}
        run: python scrape_uiu_calendar.py

      - name: Record timestamp
        if: ${{ steps.skip_check.outputs.skip == 'false' }}
        run: |
          mkdir -p web
          date -u +"%Y-%m-%dT%H:%M:%SZ" > web/.last_scrape
          git add web/.last_scrape

      - name: Prepare commit
        if: ${{ steps.skip_check.outputs.skip == 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ensure the generated JSON is staged so the create-pull-request action can pick it up
          # copy the generated JSON into the frontend public folder so the deployed site includes it
          mkdir -p uiu-academic-calendar/frontend/public || true
          cp web/calendars.json uiu-academic-calendar/frontend/public/calendars.json || true
          # stage both the canonical JSON and the frontend copy
          git add web/calendars.json web/.last_scrape uiu-academic-calendar/frontend/public/calendars.json || true
          echo "Staged files:" && git status --porcelain || true

      - id: create_pr
        name: Create Pull Request (if changes)
        if: ${{ steps.skip_check.outputs.skip == 'false' }}
        uses: peter-evans/create-pull-request@v5
        with:
          # Prefer a user PAT stored in ACTIONS_PUSH_PAT (needed if branch protection blocks GITHUB_TOKEN pushes)
          # If you haven't created the secret yet, create a Personal Access Token with 'repo' scope
          token: ${{ secrets.ACTIONS_PUSH_PAT }}
          commit-message: "Automated update: calendars.json"
          branch: "auto/scrape-update-${{ github.run_number }}"
          title: "Automated update: calendars.json"
          body: "This PR contains automated updates to web/calendars.json and .last_scrape generated by the scheduled scraper."
          base: main

      - name: Auto-merge PR (if created)
        if: ${{ steps.skip_check.outputs.skip == 'false' && steps.create_pr.outputs.pull-request-number }}
        env:
          MERGE_TOKEN: ${{ secrets.ACTIONS_PUSH_PAT || github.token }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pull-request-number }}
        run: |
          echo "Attempting to merge PR #${PR_NUMBER}"
          if [ -z "${PR_NUMBER}" ]; then
            echo "No PR number provided, skipping merge."
            exit 0
          fi
          # Call GitHub REST API to merge the pull request using the provided token
          api_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge"
          payload=$(printf '{"merge_method":"squash","commit_title":"Automated merge: calendars.json"}')
          http_status=$(curl -s -o /tmp/merge_resp -w "%{http_code}" -X PUT \
            -H "Authorization: token ${MERGE_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api_url}" \
            -d "${payload}")
          echo "Merge API returned HTTP ${http_status}"
          cat /tmp/merge_resp || true
          if [ "$http_status" -ge 200 -a "$http_status" -lt 300 ]; then
            echo "PR merged successfully"
            exit 0
          else
            echo "Failed to merge PR (HTTP ${http_status}). See response above for details."
            exit 1
          fi
