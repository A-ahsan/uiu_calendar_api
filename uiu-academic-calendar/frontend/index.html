    <script>
      // Apply the saved theme before the page paints (no white flash). '1' = dark, '0' = light, unset = follow the phone/PC
      (function () { try {
        var s = localStorage.getItem('dark');
        var dark = s === '1' || (s === null && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) { document.documentElement.classList.add('dark'); document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1a1817'); }
      } catch (e) {} })();
    </script>
